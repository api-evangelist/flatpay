aid: flatpay
name: Flatpay
description: 'Flatpay is a Copenhagen-headquartered payments company founded in 2022
  that sells card acceptance to small and medium-sized European merchants on a single
  flat per-transaction rate with no monthly subscription. Its product line is a PAX
  card terminal, an all-in-one point-of-sale system, an online payment solution for
  webshops built on the Frisbii (Billwerk+) platform, and Flatpay Capital merchant
  financing. The company operates in Denmark, Finland, Germany, Italy, France, the
  Netherlands and the United Kingdom, serves roughly 70,000 merchants, and reached
  unicorn valuation in 2025. Flatpay publishes no public developer portal, API reference
  or machine-readable specification: webshop integration is delivered through Frisbii+
  Pay plugins and a merchant-issued API key for the Frisbii gateway, which is operated
  by a different company.'
